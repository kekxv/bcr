matrix:
  bazel:
    - 7.x
    - 8.x

module_bazel_deps:
  - name: boost.asio
    version: 1.90.0.bcr.1
  - name: boost.mysql
    version: 1.90.0.bcr.1
    
tasks:
  verify_targets:
    name: Verify build targets
    platforms:
      - ubuntu2404
      - macos
    bazel: ${{ bazel }}
    build_flags:
      - '--cxxopt=-std=c++17'
      - '--@boost.asio//:ssl=boringssl'
      - '--@boost.mysql//:ssl=boringssl'
    build_targets:
      - '@khttpd//...'

  verify_targets_windows:
    name: Verify Windows build targets
    platforms:
      - windows
    bazel: ${{ bazel }}
    build_flags:
      - '--cxxopt=/std:c++17'
      - '--cxxopt=/utf-8'
      - '--@boost.asio//:ssl=boringssl'
      - '--@boost.mysql//:ssl=boringssl'
    build_targets:
      - '@khttpd//...'
