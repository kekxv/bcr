name: Publish to BCR

on:
  workflow_call:
    inputs:
      tag_name:
        description: Release tag
        required: true
        type: string
      module_name:
        description: Bazel module name
        required: true
        type: string
      registry:
        description: Target registry (owner/repo)
        required: false
        default: kekxv/bcr
        type: string
      registry_fork:
        description: Writable registry fork (owner/repo)
        required: false
        default: ''
        type: string
      tag_prefix:
        description: Tag prefix removed from the module version
        required: false
        default: v
        type: string
      templates_dir:
        description: Template directory in the caller repository
        required: false
        default: .bcr
        type: string
      draft:
        description: Create a draft pull request
        required: false
        default: false
        type: boolean
      source_url:
        description: Explicit source archive URL
        required: false
        default: ''
        type: string
      strip_prefix:
        description: Explicit archive strip_prefix
        required: false
        default: ''
        type: string
    secrets:
      publish_token:
        required: false
    outputs:
      module_name:
        value: ${{ jobs.publish.outputs.module_name }}
      version:
        value: ${{ jobs.publish.outputs.version }}
      pull_request_url:
        value: ${{ jobs.pr.outputs.url }}

  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag
        required: true
        type: string
      module_name:
        description: Bazel module name
        required: true
        type: string
      registry:
        description: Target registry (owner/repo)
        required: false
        default: kekxv/bcr
        type: string
      registry_fork:
        description: Writable registry fork (owner/repo)
        required: false
        default: ''
        type: string
      tag_prefix:
        description: Tag prefix removed from the module version
        required: false
        default: v
        type: string
      templates_dir:
        description: Template directory
        required: false
        default: .bcr
        type: string
      draft:
        description: Create a draft pull request
        required: false
        default: false
        type: boolean
      source_url:
        description: Explicit source archive URL
        required: false
        default: ''
        type: string
      strip_prefix:
        description: Explicit archive strip_prefix
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: publish-to-bcr-${{ github.repository }}-${{ inputs.module_name }}-${{ inputs.tag_name }}
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      strategy: ${{ steps.detect.outputs.strategy }}
      token_type: ${{ steps.detect.outputs.token_type }}
      target: ${{ steps.detect.outputs.registry_fork }}
    steps:
      - name: Checkout publisher scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: kekxv/bcr
          ref: publish-to-bcr
          path: publisher
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Detect publishing strategy
        id: detect
        env:
          CALLER_REPOSITORY: ${{ github.repository }}
          TARGET_REGISTRY: ${{ inputs.registry }}
          REGISTRY_FORK: ${{ inputs.registry_fork }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python publisher/.github/scripts/fork_detector.py \
            --repository "$CALLER_REPOSITORY" \
            --registry "$TARGET_REGISTRY" \
            --registry-fork "$REGISTRY_FORK"

      - name: Report detection failure
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "### ❌ BCR publishing strategy detection failed"
            echo
            echo "Check the failed step for repository/fork validation details."
            echo
            echo "[Open workflow run]($RUN_URL)"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    runs-on: ubuntu-latest
    needs: detect
    outputs:
      module_name: ${{ steps.publish.outputs.module_name }}
      version: ${{ steps.publish.outputs.version }}
      branch_name: ${{ steps.publish.outputs.branch_name }}
    steps:
      - name: Validate publishing token
        if: needs.detect.outputs.token_type == 'PAT'
        env:
          PUBLISH_TOKEN: ${{ secrets.publish_token }}
        run: |
          if [ -z "$PUBLISH_TOKEN" ]; then
            echo "This publishing strategy requires the publish_token secret"
            exit 1
          fi

      - name: Checkout release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag_name }}
          path: ruleset
          persist-credentials: false

      - name: Checkout publisher scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: kekxv/bcr
          ref: publish-to-bcr
          path: publisher
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Checkout target registry
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ needs.detect.outputs.target }}
          ref: main
          path: registry
          token: ${{ needs.detect.outputs.token_type == 'PAT' && secrets.publish_token || github.token }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Generate registry entry
        id: publish
        env:
          TAG_NAME: ${{ inputs.tag_name }}
          MODULE_NAME: ${{ inputs.module_name }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
          TEMPLATES_DIR: ${{ inputs.templates_dir }}
          SOURCE_URL: ${{ inputs.source_url }}
          STRIP_PREFIX: ${{ inputs.strip_prefix }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -o pipefail
          python publisher/.github/scripts/publish_action.py \
            --tag-name "$TAG_NAME" \
            --module-name "$MODULE_NAME" \
            --registry-path registry \
            --ruleset-path ruleset \
            --tag-prefix "$TAG_PREFIX" \
            --templates-dir "$TEMPLATES_DIR" \
            --source-url "$SOURCE_URL" \
            --strip-prefix "$STRIP_PREFIX" 2>&1 | tee publish-error.log

      - name: Stage registry entry artifact
        env:
          MODULE_NAME: ${{ steps.publish.outputs.module_name }}
        run: |
          mkdir -p bcr-entry
          cp -R "registry/modules/$MODULE_NAME" bcr-entry/

      - name: Upload registry entry
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bcr-entry
          path: bcr-entry
          retention-days: 1
          if-no-files-found: error

      - name: Report generation failure
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import html
          import os
          from pathlib import Path

          log = Path("publish-error.log")
          details = log.read_text(errors="replace")[-12000:] if log.exists() else (
              "The failure happened before or after registry entry generation. "
              "Check the failed workflow step for details."
          )
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as output:
              output.write("### ❌ BCR registry entry generation failed\n\n")
              output.write("<details><summary>Error details</summary>\n\n<pre>")
              output.write(html.escape(details))
              output.write("</pre>\n\n</details>\n\n")
              output.write(f"[Open workflow run]({os.environ['RUN_URL']})\n")
          PY

  pr:
    runs-on: ubuntu-latest
    needs: [detect, publish]
    if: needs.publish.outputs.branch_name != ''
    permissions:
      contents: write
      pull-requests: write
    outputs:
      url: ${{ steps.pull-request.outputs.url }}
    steps:
      - name: Validate publishing token
        if: needs.detect.outputs.token_type == 'PAT'
        env:
          PUBLISH_TOKEN: ${{ secrets.publish_token }}
        run: |
          if [ -z "$PUBLISH_TOKEN" ]; then
            echo "This publishing strategy requires the publish_token secret"
            exit 1
          fi

      - name: Checkout writable registry
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ needs.detect.outputs.target }}
          ref: main
          path: registry
          token: ${{ needs.detect.outputs.token_type == 'PAT' && secrets.publish_token || github.token }}
          fetch-depth: 0

      - name: Download registry entry
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bcr-entry
          path: registry/modules

      - name: Push publishing branch
        env:
          BRANCH_NAME: ${{ needs.publish.outputs.branch_name }}
          MODULE_NAME: ${{ needs.publish.outputs.module_name }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          cd registry
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH_NAME:refs/remotes/origin/$BRANCH_NAME" || true
          git checkout -B "$BRANCH_NAME"
          git add -A
          if git diff --cached --quiet; then
            echo "No registry changes to publish"
            exit 1
          fi
          git commit -m "${MODULE_NAME}@${VERSION}"
          git push --force-with-lease origin "$BRANCH_NAME"

      - name: Create or find pull request
        id: pull-request
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          MODULE_NAME: ${{ needs.publish.outputs.module_name }}
          VERSION: ${{ needs.publish.outputs.version }}
          BRANCH_NAME: ${{ needs.publish.outputs.branch_name }}
          CALLER_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag_name }}
          STRATEGY: ${{ needs.detect.outputs.strategy }}
          PUSH_TARGET: ${{ needs.detect.outputs.target }}
          TARGET_REGISTRY: ${{ inputs.registry }}
          DRAFT: ${{ inputs.draft }}
        with:
          github-token: ${{ needs.detect.outputs.token_type == 'PAT' && secrets.publish_token || github.token }}
          script: |
            const [owner, repo] = process.env.TARGET_REGISTRY.split('/');
            const forkOwner = process.env.PUSH_TARGET.split('/')[0];
            const head = process.env.STRATEGY === 'EXTERNAL_FORK' ||
                         process.env.STRATEGY === 'SAME_REGISTRY_FORK'
              ? `${forkOwner}:${process.env.BRANCH_NAME}`
              : process.env.BRANCH_NAME;
            const title = `Add ${process.env.MODULE_NAME}@${process.env.VERSION}`;
            const body = [
              `### ${process.env.MODULE_NAME}@${process.env.VERSION}`,
              '',
              `Release: https://github.com/${process.env.CALLER_REPOSITORY}/releases/tag/${encodeURIComponent(process.env.RELEASE_TAG)}`,
              '',
              '---',
              'Generated by publish-to-bcr',
            ].join('\n');

            try {
              const result = await github.rest.pulls.create({
                owner,
                repo,
                title,
                head,
                base: 'main',
                body,
                draft: process.env.DRAFT === 'true',
              });
              core.setOutput('url', result.data.html_url);
            } catch (error) {
              if (error.status !== 422) throw error;
              const existing = await github.rest.pulls.list({
                owner,
                repo,
                head: `${forkOwner}:${process.env.BRANCH_NAME}`,
                base: 'main',
                state: 'open',
              });
              if (!existing.data.length) throw error;
              core.setOutput('url', existing.data[0].html_url);
            }

      - name: Report push or pull request failure
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MODULE_NAME: ${{ needs.publish.outputs.module_name }}
          VERSION: ${{ needs.publish.outputs.version }}
          PUSH_TARGET: ${{ needs.detect.outputs.target }}
        run: |
          {
            echo "### ❌ BCR branch or pull request creation failed"
            echo
            echo "- Module: \`$MODULE_NAME@$VERSION\`"
            echo "- Push target: \`$PUSH_TARGET\`"
            echo
            echo "Check the failed step for Git push or GitHub API details."
            echo
            echo "[Open workflow run]($RUN_URL)"
          } >> "$GITHUB_STEP_SUMMARY"
