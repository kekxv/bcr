name: Skip Check Handler

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  handle-skip-check:
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, 'bcr skip_check')
    runs-on: ubuntu-latest
    steps:
      - name: Validate command and add skip label
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const allowedChecks = new Set([
              'url-stability-check',
              'module-dot-bazel-check',
              'presubmit-yaml-check',
              'attestations-check',
              'source-integrity-check',
            ]);

            // Parse the event payload as data. Never interpolate comment text into
            // shell or JavaScript source code.
            const body = context.payload.comment.body;
            const match = body.match(/^bcr[ \t]+skip_check[ \t]+([a-z0-9-]+)[ \t]*$/);
            if (!match) {
              core.setFailed('Invalid command. Expected: bcr skip_check <check-name>');
              return;
            }

            const check = match[1];
            if (!allowedChecks.has(check)) {
              core.setFailed(`Invalid check name: ${check}`);
              return;
            }

            // This workflow may only add skip-* labels. In particular, it can
            // never grant the presubmit-auto-run capability.
            const label = check === 'url-stability-check'
              ? 'skip-url-stability'
              : `skip-${check}`;
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [label],
            });

            core.notice(`Label '${label}' added to PR #${context.issue.number}`);
