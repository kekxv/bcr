name: Publish Registry to gh-pages

on:
  push:
    branches: [main, master]
    paths:
      - 'modules/**'
      - '.github/scripts/**'
      - '.github/workflows/publish.yml'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 50
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --requirement .github/requirements-ci.txt

      - name: Generate registry files
        run: |
          python .github/scripts/publish.py
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Prepare public site
        run: |
          if [ -n "$(find modules -type l -print -quit)" ]; then
            echo "Refusing to publish module symbolic links"
            exit 1
          fi
          mkdir -p _site
          cp index.html bazel_registry.json registry-data.json _site/
          cp -R modules _site/modules

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@373f7f263a76c20808c831209c920827a82a2847 # v3.9.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
