name: Generate Module Diff

on:
  pull_request:
    paths:
      - 'modules/**'
      - '.github/scripts/**'
      - '.github/workflows/generate_diff.yml'
      - 'pyproject.toml'
      - 'uv.lock'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: '3.11'
          enable-cache: true

      - name: Generate diff
        id: diff
        run: |
          uv run --frozen --group ci python .github/scripts/generate_diff.py \
            --base-ref ${{ github.event.pull_request.base.sha }} \
            --output .github/diff-results.md

      - name: Output diff to Job Summary
        run: |
          if [ -f .github/diff-results.md ]; then
            cat .github/diff-results.md >> $GITHUB_STEP_SUMMARY
          else
            echo "### ℹ️ No Changes Detected" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No new or modified module versions found." >> $GITHUB_STEP_SUMMARY
          fi
